{% extends "app.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1></div></div>
<form method="post" class="panel form" style="max-width: 640px" novalidate>
  {% csrf_token %}
  {% include "partials/form_errors.html" %}
  {% for field in form %}{% include "partials/field.html" with field=field %}{% endfor %}
  <div class="form-actions"><button class="btn btn-primary" type="submit">{{ submit }}</button><a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a></div>
</form>
{% endblock %}
